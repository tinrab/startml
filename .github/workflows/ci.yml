name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Note: installs the CUDA PyTorch wheels from uv.lock (a few GB); tests run on CPU.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests scripts

      # - name: Test
      #   run: uv run pytest -m "not gpu"
