_target_: startml.models.ClassifierModule
num_classes: 10
label_smoothing: 0.0
compile: false

net:
  _target_: startml.models.nets.SimpleCNN
  in_channels: 1
  channels: [32, 64]
  output_size: ${model.num_classes}
  dropout: 0.1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-2

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
scheduler_interval: epoch
