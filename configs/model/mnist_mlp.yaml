_target_: startml.models.ClassifierModule
num_classes: 10
label_smoothing: 0.0
# torch.compile the network (in place) before fitting.
compile: false

net:
  _target_: startml.models.nets.MLP
  input_size: 784
  hidden_sizes: [256, 256]
  output_size: ${model.num_classes}
  dropout: 0.1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-2

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
scheduler_interval: epoch
