# @package _global_
# Fine-tune DistilBERT on GLUE SST-2: uv run train experiment=sst2_distilbert

defaults:
  - override /data: sst2
  - override /model: distilbert
  - override /trainer: gpu
  - override /logger: wandb

tags: [sst2, distilbert]

seed: 42

trainer:
  max_epochs: 3
  gradient_clip_val: 1.0
  val_check_interval: 0.25

callbacks:
  learning_rate_monitor:
    logging_interval: step
