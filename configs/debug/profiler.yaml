# @package _global_
# Profile one epoch; the report is printed and saved to the output dir.

defaults:
  - default

trainer:
  max_epochs: 1
  limit_train_batches: 50
  limit_val_batches: 10
  profiler:
    _target_: lightning.pytorch.profilers.SimpleProfiler
    dirpath: ${paths.output_dir}
    filename: profile
